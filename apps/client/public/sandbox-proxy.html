<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MCP Sandbox Proxy</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
      }
      #app-frame {
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <script>
      let appFrame = null;

      const defaultCsp =
        "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' data:; connect-src 'none';";

      const buildCsp = (csp) => {
        if (!csp) return defaultCsp;
        const format = (domains) =>
          Array.isArray(domains) && domains.length > 0
            ? ` ${domains.join(" ")}`
            : "";
        return [
          "default-src 'none'",
          `script-src 'self' 'unsafe-inline'${format(csp.resourceDomains)}`,
          `style-src 'self' 'unsafe-inline'${format(csp.resourceDomains)}`,
          `img-src 'self' data:${format(csp.resourceDomains)}`,
          `media-src 'self' data:${format(csp.resourceDomains)}`,
          `connect-src 'self'${format(csp.connectDomains)}`,
          `frame-src${format(csp.frameDomains) || " 'none'"}`,
          `base-uri${format(csp.baseUriDomains) || " 'self'"}`,
        ].join("; ");
      };

      const renderAppFrame = ({ html, csp, permissions, sandbox }) => {
        if (appFrame) {
          appFrame.remove();
        }

        appFrame = document.createElement("iframe");
        appFrame.id = "app-frame";
        appFrame.setAttribute(
          "sandbox",
          sandbox || "allow-scripts allow-same-origin allow-forms",
        );
        if (permissions) {
          appFrame.setAttribute("allow", permissions);
        }

        const cspValue = buildCsp(csp);
        const srcdoc = `<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="${cspValue}" />
  </head>
  <body>
${html}
  </body>
</html>`;

        appFrame.srcdoc = srcdoc;
        document.body.appendChild(appFrame);
      };

      const isSandboxMessage = (data) =>
        typeof data?.method === "string" &&
        data.method.startsWith("ui/notifications/sandbox-");

      window.addEventListener("message", (event) => {
        const data = event.data;
        if (!data || typeof data !== "object") return;

        if (event.source === window.parent) {
          if (data.method === "ui/notifications/sandbox-resource-ready") {
            const { html, csp, permissions, sandbox } = data.params || {};
            if (typeof html === "string") {
              renderAppFrame({ html, csp, permissions, sandbox });
            }
            return;
          }

          if (!isSandboxMessage(data) && appFrame?.contentWindow) {
            appFrame.contentWindow.postMessage(data, "*");
          }
        }

        if (event.source === appFrame?.contentWindow) {
          window.parent.postMessage(data, "*");
        }
      });

      window.parent.postMessage(
        {
          method: "ui/notifications/sandbox-proxy-ready",
          params: {},
        },
        "*",
      );
    </script>
  </body>
</html>
