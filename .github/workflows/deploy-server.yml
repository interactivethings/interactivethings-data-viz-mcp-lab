name: Deploy - Server to GCP Artifact Registry

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/server/**"
      - "packages/domain/**"
      - ".github/workflows/deploy-server.yml"

jobs:
  # Run quality checks before deploying
  check:
    name: "Check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        uses: ./.github/actions/setup

      - name: Run Lint
        run: bun lint

      - name: Verify Types
        run: bun type-check --filter=server

      - name: Check Formatting
        run: bun format:check

  deploy-server:
    name: "Deploy Server"
    needs: check
    runs-on: ubuntu-latest
    env:
      GCP_REGION: "europe-west6"
      ARTIFACT_REGISTRY_REPOSITORY: "lab-dataviz-mcp"
      IMAGE_NAME: "server"
      CLOUD_RUN_SERVICE: "lab-dataviz-mcp-server"
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - uses: "google-github-actions/auth@v3"
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: projects/516447198205/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: "google-github-actions/setup-gcloud@v3"
      - run: |
          BUILD_ID=$(gcloud builds submit --async --format="value(id)" --config cloudbuild.yaml --substitutions _REGION=${{ env.GCP_REGION }},_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }},_REPOSITORY=${{ env.ARTIFACT_REGISTRY_REPOSITORY }},_IMAGE=${{ env.IMAGE_NAME }})
          while true; do
            STATUS=$(gcloud builds describe "$BUILD_ID" --format="value(status)")
            if [ "$STATUS" = "SUCCESS" ]; then
              break
            fi
            if [ "$STATUS" = "FAILURE" ] || [ "$STATUS" = "INTERNAL_ERROR" ] || [ "$STATUS" = "TIMEOUT" ] || [ "$STATUS" = "CANCELLED" ] || [ "$STATUS" = "EXPIRED" ]; then
              gcloud builds describe "$BUILD_ID"
              exit 1
            fi
            sleep 5
          done

      - uses: "google-github-actions/deploy-cloudrun@v3"
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          region: ${{ env.GCP_REGION }}
          service: ${{ env.CLOUD_RUN_SERVICE }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPOSITORY }}/${{ env.IMAGE_NAME }}:latest
